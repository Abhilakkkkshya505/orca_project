[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orca_ml"
version = "0.1.0"
description = "ORCA advisory marine ML models and evaluation framework"
authors = [{ name = "ORCA Project Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
train = [
    "scikit-learn>=1.3",
    "scipy>=1.10",
]
serve = [
    "scikit-learn>=1.3",
    "joblib>=1.3",
]
test = [
    "pytest>=8.0",
    "hypothesis>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
