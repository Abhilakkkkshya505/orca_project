<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="orcaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2231" />
      <stop offset="100%" stop-color="#0F5C6E" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#orcaGrad)"/>
  
  <!-- Outer navigational ring -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#F4F1EA" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>
  
  <!-- Ocean Wave swell -->
  <path d="M12 40 C 18 33, 24 33, 30 38 C 36 43, 42 43, 52 35 L 52 46 C 42 50, 36 47, 30 45 C 24 43, 18 45, 12 48 Z" fill="url(#waveGrad)" opacity="0.85"/>
  
  <!-- Stylized Orca dorsal fin / Compass Needle -->
  <path d="M 28 36 C 29 28, 32 18, 41 15 C 38 23, 37 28, 38 34 Z" fill="#F4F1EA"/>
  
  <!-- Compass Star / Safety Pearl -->
  <circle cx="21" cy="23" r="3" fill="#38BDF8"/>
  <circle cx="21" cy="23" r="1.5" fill="#FFFFFF"/>
</svg>
