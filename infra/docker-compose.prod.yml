name: orca-prod

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: orca-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: orca
      POSTGRES_USER: orca_app
      POSTGRES_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orca_app -d orca"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536M

  redis:
    image: redis:7-alpine
    container_name: orca-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    image: ghcr.io/orca/backend:${RELEASE_TAG:-latest}
    container_name: orca-prod-api
    restart: unless-stopped
    env_file:
      - /opt/orca/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live/')"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1024M

  worker:
    image: ghcr.io/orca/backend:${RELEASE_TAG:-latest}
    container_name: orca-prod-worker
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=2"]
    env_file:
      - /opt/orca/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M

  beat:
    image: ghcr.io/orca/backend:${RELEASE_TAG:-latest}
    container_name: orca-prod-beat
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    env_file:
      - /opt/orca/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: orca-prod-cloudflared
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARED_TUNNEL_TOKEN}"]
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
  redisdata:
