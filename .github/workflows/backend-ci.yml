name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: orca_test
          POSTGRES_USER: orca
          POSTGRES_PASSWORD: orca_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system geospatial libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev libproj-dev

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint and Format Check (ruff)
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Type Check (mypy)
        working-directory: backend
        run: |
          mypy .

      - name: Check for Missing Migrations
        working-directory: backend
        env:
          DATABASE_URL: postgis://orca:orca_password@localhost:5432/orca_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-32-chars-minimum-length
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Test Suite with Coverage
        working-directory: backend
        env:
          DATABASE_URL: postgis://orca:orca_password@localhost:5432/orca_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-32-chars-minimum-length
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          pytest --cov=apps --cov-report=term-missing --cov-report=xml

      - name: Production Deployment Settings Check
        working-directory: backend
        env:
          DATABASE_URL: postgis://orca:orca_password@localhost:5432/orca_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-32-chars-minimum-length
          DJANGO_SETTINGS_MODULE: config.settings.prod
          ENVIRONMENT: production
          ALLOWED_HOSTS: api.orca.example
          CSRF_TRUSTED_ORIGINS: https://app.orca.example
          CORS_ALLOWED_ORIGINS: https://app.orca.example
          COOKIE_DOMAIN: .orca.example
          FRONTEND_URL: https://app.orca.example
          TURNSTILE_SECRET_KEY: dummy_turnstile_secret_key
          CF_ACCESS_TEAM_DOMAIN: example.cloudflareaccess.com
          CF_ACCESS_AUD: dummy_aud
          COVERAGE_BBOX: 68.0,6.0,89.0,24.0
        run: |
          python manage.py check --deploy

      - name: Security Vulnerability Audit (pip-audit)
        working-directory: backend
        run: |
          pip-audit || true

      - name: Generate and Validate OpenAPI Schema
        working-directory: backend
        env:
          DATABASE_URL: postgis://orca:orca_password@localhost:5432/orca_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-32-chars-minimum-length
        run: |
          python manage.py spectacular --file schema.yml --validate

      - name: Upload OpenAPI Schema Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: backend/schema.yml
